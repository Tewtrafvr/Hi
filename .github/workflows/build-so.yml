name: Build libMonkeyClient.so

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          CMAKE=$(find . -name CMakeLists.txt -not -path './build*' | head -1)
          echo "PROJ=$(dirname "$CMAKE")" >> "$GITHUB_ENV"

      - name: Build (arm64-v8a)
        run: |
          cd "$PROJ"
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          chmod +x build.sh
          ./build.sh

      - name: Upload the .so
        uses: actions/upload-artifact@v4
        with:
          name: libMonkeyClient
          path: ${{ env.PROJ }}/build/libMonkeyClient.so
          if-no-files-found: error
